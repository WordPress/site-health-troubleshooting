name: Compatibility Check

on:
  workflow_dispatch:

jobs:
  # Every WordPress release from the plugin's minimum (6.4) up to the latest,
  # each tested at the lowest PHP version it supports and at a modern PHP.
  # WordPress 7.0 raised its PHP minimum to 7.4, so PHP 7.2 stops at 6.9.
  test-wp-versions:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        wp: ['6.4', '6.5', '6.6', '6.7', '6.8', '6.9', '7.0', '7.1']
        php: ['min', '8.3']
        include:
          - { wp: '6.4', php: 'min', php-version: '7.2' }
          - { wp: '6.5', php: 'min', php-version: '7.2' }
          - { wp: '6.6', php: 'min', php-version: '7.2' }
          - { wp: '6.7', php: 'min', php-version: '7.2' }
          - { wp: '6.8', php: 'min', php-version: '7.2' }
          - { wp: '6.9', php: 'min', php-version: '7.2' }
          - { wp: '7.0', php: 'min', php-version: '7.4' }
          - { wp: '7.1', php: 'min', php-version: '7.4' }
          - { php: '8.3', php-version: '8.3' }

    env:
      PLAYWRIGHT_REUSE_EXISTING_SERVER: 'true'
      WP_ENV_CORE: https://wordpress.org/wordpress-${{ matrix.wp }}.zip
      WP_ENV_PHP_VERSION: ${{ matrix.php-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install NodeJS
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build plugin
        run: npm run build

      - name: Prepare CI wp-env override
        run: printf '%s\n' '{"plugins":["."]}' > .wp-env.override.json

      - name: Start wp-env
        timeout-minutes: 10
        run: npm run wp-env start

      - name: Run test suite
        run: npm test

  test-php-versions:
    name: PHP ${{ matrix.php }} / WP 7.1 (latest)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    env:
      PLAYWRIGHT_REUSE_EXISTING_SERVER: 'true'
      WP_ENV_CORE: https://wordpress.org/wordpress-7.1.zip
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install NodeJS
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build plugin
        run: npm run build

      - name: Prepare CI wp-env override
        run: printf '%s\n' '{"plugins":["."]}' > .wp-env.override.json

      - name: Start wp-env
        timeout-minutes: 10
        run: npm run wp-env start

      - name: Run test suite
        run: npm test
